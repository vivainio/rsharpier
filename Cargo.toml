[package]
name = "csharpier-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
quick-xml = "0.42.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tree-sitter = "0.27.1"
tree-sitter-c-sharp = { path = "grammar/tree-sitter-c-sharp" }

[[bin]]
name = "rsharpier"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
